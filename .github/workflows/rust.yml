name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Linux system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libwayland-dev pkg-config
    - name: Run tests
      run: cargo test --verbose

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build (release)
      run: cargo build --release --package game
    - name: Package game and assets
      shell: pwsh
      run: |
        New-Item -ItemType Directory dist/ducklings-windows-x64 | Out-Null
        Copy-Item target/release/game.exe dist/ducklings-windows-x64/
        Copy-Item -Recurse assets dist/ducklings-windows-x64/assets
        Compress-Archive -Path dist/ducklings-windows-x64 -DestinationPath dist/ducklings-windows-x64.zip
    - name: Upload Windows build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ducklings-windows-x64
        path: dist/ducklings-windows-x64.zip

  build-linux:
    # Ubuntu 22.04 ships glibc 2.35 — older than SteamOS 3 (Steam Deck), so
    # binaries built here run on the Deck without a toolchain mismatch.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install Linux system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libwayland-dev pkg-config
    - name: Build (release)
      run: cargo build --release --package game
    - name: Package game and assets
      run: |
        mkdir -p dist/ducklings-linux-x64
        cp target/release/game dist/ducklings-linux-x64/
        cp -r assets dist/ducklings-linux-x64/assets
        tar -czf dist/ducklings-linux-x64.tar.gz -C dist ducklings-linux-x64
    - name: Upload Linux build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ducklings-linux-x64
        path: dist/ducklings-linux-x64.tar.gz
