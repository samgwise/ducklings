name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install Linux system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev libwayland-dev pkg-config
    - name: Cache cargo builds
      uses: Swatinem/rust-cache@v2
    - name: Run tests
      run: cargo test --verbose

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - name: Cache cargo builds
      uses: Swatinem/rust-cache@v2
    - name: Build (release)
      run: cargo build --release --package game
    - name: Package game and assets
      shell: pwsh
      run: |
        New-Item -ItemType Directory dist/ducklings-windows-x64 | Out-Null
        Copy-Item target/release/game.exe dist/ducklings-windows-x64/
        Copy-Item -Recurse assets dist/ducklings-windows-x64/assets
        Compress-Archive -Path dist/ducklings-windows-x64 -DestinationPath dist/ducklings-windows-x64.zip
    - name: Upload Windows build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ducklings-windows-x64
        path: dist/ducklings-windows-x64.zip

  build-linux:
    # Built inside a pinned Ubuntu 22.04 *container* (glibc 2.35) — older
    # than SteamOS 3 (Steam Deck), so binaries built here run on the Deck.
    # Pinning the container keeps the glibc stable even as GitHub migrates
    # the ubuntu-22.04 runner label onto newer images.
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
    - name: Install toolchain and system dependencies
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y ca-certificates git curl build-essential libasound2-dev libudev-dev libwayland-dev pkg-config
    - uses: actions/checkout@v5
    - name: Install Rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Cache cargo builds
      uses: Swatinem/rust-cache@v2
    - name: Build (release)
      run: cargo build --release --package game
    - name: Package game and assets
      run: |
        mkdir -p dist/ducklings-linux-x64
        cp target/release/game dist/ducklings-linux-x64/
        cp -r assets dist/ducklings-linux-x64/assets
        tar -czf dist/ducklings-linux-x64.tar.gz -C dist ducklings-linux-x64
    - name: Upload Linux build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ducklings-linux-x64
        path: dist/ducklings-linux-x64.tar.gz

  release:
    # Rolling release: each green main build republishes the nightly release
    # with fresh archives, so the Releases page always offers the latest
    # playable download with stable asset URLs.
    if: github.ref == 'refs/heads/main'
    needs: [test, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v4
      with:
        path: dist
    - name: Publish rolling release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete nightly --cleanup-tag -y || true
        gh release create nightly dist/*/* \
          --target "$GITHUB_SHA" \
          --title "Ducklings — rolling build" \
          --latest \
          --notes "Automated build of main at commit ${GITHUB_SHA:0:7} — extract an archive and run from inside the folder. ducklings-windows-x64.zip for Windows, ducklings-linux-x64.tar.gz for Linux and SteamOS (Steam Deck)."
